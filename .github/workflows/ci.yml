name: CI

on:
  push:
    branches: [main]
  pull_request:

# the jobs run npm packages and their install scripts: the token can only read
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: cadence:ci
          # npm ci and the build are reused while nothing they depend on changed
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Linux and Windows desktop app (Electron): package it, start the packaged app once (smoke test: the bundled server
  # must come up and the UI render), keep the installers as artifacts of the run for a few days. The build and the
  # smoke test decide the job; an upload that fails (e.g. the artifact storage quota of the account is used up) does not.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: desktop:dist
            app: build/desktop/linux-unpacked/cadence
            files: |
              build/desktop/*.AppImage
              build/desktop/*.deb
          - os: windows-latest
            dist: desktop:win
            app: build/desktop/win-unpacked/Cadence.exe
            files: build/desktop/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # the Electron runtime and tools (NSIS, AppImage, winCodeSign) that electron-builder downloads for packaging
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run ${{ matrix.dist }}
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          export CADENCE_DATA_DIR="$RUNNER_TEMP/cadence" CADENCE_DESKTOP_SMOKE="$RUNNER_TEMP/smoke.png"
          xvfb-run -a ${{ matrix.app }} --no-sandbox | tee smoke.log
          test -s "$CADENCE_DESKTOP_SMOKE" || { cat "$CADENCE_DATA_DIR/logs/server.log"; exit 1; }
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CADENCE_DATA_DIR = "$env:RUNNER_TEMP\cadence"
          $env:CADENCE_DESKTOP_SMOKE = "$env:RUNNER_TEMP\smoke.png"
          $p = Start-Process -FilePath "${{ matrix.app }}" -PassThru -Wait
          # the app writes the screenshot only when the server started and the app shell rendered
          if (-not (Test-Path $env:CADENCE_DESKTOP_SMOKE)) {
            Get-Content "$env:CADENCE_DATA_DIR\logs\server.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Output "smoke test passed (exit code $($p.ExitCode))"
      - name: Installers exist
        shell: bash
        env:
          FILES: ${{ matrix.files }}
        run: ls -l $FILES
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smoke-${{ runner.os }}
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cadence-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 3

  # macOS app (Swift shell + bundled Node runtime) as a disk image
  macos-app:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run mac -- --dmg
      - name: Shell tests
        run: swift test --package-path apps/macos
      # start the built app once: its server must come up and the UI render (CADENCE_SMOKE, see SmokeTest.swift)
      - name: Smoke test
        timeout-minutes: 5
        run: |
          export CADENCE_DATA_DIR="$RUNNER_TEMP/cadence" CADENCE_SMOKE="$RUNNER_TEMP/smoke.png"
          build/Cadence.app/Contents/MacOS/Cadence || { cat "$CADENCE_DATA_DIR/logs/server.log" || true; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smoke-macOS
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Disk image exists
        run: ls -l build/Cadence-*.dmg
      # like the desktop installers: kept for a few days, and a failing upload does not fail the build
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cadence-macOS
          path: build/Cadence-*.dmg
          if-no-files-found: error
          retention-days: 3
